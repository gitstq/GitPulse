[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpulse"
version = "1.0.0"
description = "AI驱动的Git工作流智能助手"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GitPulse Team", email = "gitpulse@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Version Control :: Git",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["git", "ai", "cli", "commit", "workflow", "automation"]
requires-python = ">=3.8"

[project.scripts]
gitpulse = "gitpulse.cli:main"
gp = "gitpulse.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/GitPulse"
Repository = "https://github.com/gitstq/GitPulse"
Issues = "https://github.com/gitstq/GitPulse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
